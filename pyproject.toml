[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zarro"
dynamic = ["version"]
description = "A python package to handle data saving in experiments using zarr"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name="Niyaz Beysengulov", email="nbeysengulov@eeroq.com"},
]

[project.urls]
Homepage = "https://github.com/eeroqlab/zarro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/zarro/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"